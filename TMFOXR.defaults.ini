[Interface]
# Key used to open and close the in-headset settings panel. It can also be
# rebound from the Interface tab inside the panel.
SettingsToggleKey=F10

[Camera]
; Apply a VR-only driver-seat offset while camera 3 is selected.
CockpitEnabled=1

; A short near clip keeps the dashboard and steering wheel from being cut off.
CockpitNearClip=0.2

; Keep the headset horizon level with the world while preserving the car's heading.
HorizonLock=1
; Begin releasing the lock at this car-tilt angle and fully follow the car by the second angle.
HorizonLockReleaseStart=35.0
HorizonLockReleaseEnd=70.0

; Each environment gets an independent camera-3 seat position. Values are
; metres in camera-local axes: positive right, positive up, positive forward.
; Negative forward moves camera 3 back from the nose toward the driver's seat.
[Camera.Stadium]
CockpitOffsetRight=-0.05
CockpitOffsetUp=-0.45
CockpitOffsetForward=-0.65

[Camera.Island]
CockpitOffsetRight=-0.43
CockpitOffsetUp=-0.55
CockpitOffsetForward=-0.75

[Camera.Desert]
CockpitOffsetRight=-0.43
CockpitOffsetUp=-0.09
CockpitOffsetForward=-0.60

[Camera.Rally]
CockpitOffsetRight=-0.43
CockpitOffsetUp=-0.24
CockpitOffsetForward=-0.40

[Camera.Bay]
CockpitOffsetRight=-0.47
CockpitOffsetUp=-0.14
CockpitOffsetForward=-0.60

[Camera.Coast]
CockpitOffsetRight=-0.43
CockpitOffsetUp=-0.41
CockpitOffsetForward=-0.98

[Camera.Snow]
CockpitOffsetRight=-0.43
CockpitOffsetUp=0.2
CockpitOffsetForward=-0.71

[Performance]
FrustumCullingFix=1
MirrorEyeToDesktop=1

# Translate the regular D3D9 game device through Windows D3D9On12 so completed
# eye surfaces can remain on the GPU. Set to 0 if a system has compatibility issues.
D3D9On12=1

[Compatibility]
# TMUF's launcher and game can misread modern or dual-GPU video memory, causing
# blurry textures and crashes on complex maps. 2048 selects the highest safe
# effective value below TMUF's signed 2 GiB boundary and matches the established
# dgVoodoo workaround. Set to 0 only to restore the driver's original reports.
VideoMemoryMB=2048

[Diagnostics]
# Set to 1 when detailed shader, draw-replay, and tracked-pose diagnostics are needed.
Verbose=0
